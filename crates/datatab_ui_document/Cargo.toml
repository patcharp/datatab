[package]
name = "datatab_ui_document"
edition.workspace = true
version.workspace = true
authors.workspace = true
description = "Document subsystem (tabs, panes, code/data/audit/chart/key-value documents) for DataTab"
repository.workspace = true
homepage.workspace = true
license.workspace = true

[lib]

[dependencies]
gpui.workspace = true
gpui-base = { path = "../../vendor/gpui-base" }
gpui-component.workspace = true
datatab_ui_base.workspace = true
datatab_components.workspace = true
datatab_core.workspace = true
datatab_app.workspace = true
datatab_audit.workspace = true
datatab_storage.workspace = true
datatab_export.workspace = true
datatab_byte_source.workspace = true
datatab_delimited.workspace = true
datatab_spreadsheet.workspace = true
datatab_parquet.workspace = true
datatab_i18n.workspace = true
datatab_transfer.workspace = true
datatab_schema_viz.workspace = true
petgraph.workspace = true
uuid.workspace = true
chrono.workspace = true
encoding_rs.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
lsp-types = { workspace = true }
fuzzy-matcher.workspace = true
anyhow = { workspace = true }
rfd.workspace = true
image.workspace = true
datatab_mcp = { workspace = true, optional = true }
datatab_policy = { workspace = true, optional = true }

[features]
default = []
mcp = ["datatab_mcp", "datatab_policy", "datatab_app/mcp", "datatab_ui_base/mcp"]
# `lua` is a passthrough: no document code uses it directly, but it
# must forward to datatab_app/datatab_ui_base so datatab_app is not built twice with
# mismatched feature sets across the workspace.
lua = ["datatab_app/lua", "datatab_ui_base/lua"]
# Constructors that let tests in other crates build documents without a
# connection. Enabled only by dev-dependencies.
test-support = []

[dev-dependencies]
async-trait.workspace = true
gpui = { workspace = true, features = ["test-support"] }
datatab_components = { workspace = true, features = ["test-support"] }
datatab_ui_base = { workspace = true, features = ["test-support"] }
datatab_driver_mssql = { workspace = true }
datatab_driver_mongodb = { workspace = true }
datatab_test_support = { workspace = true }
flate2.workspace = true
rmp-serde.workspace = true
parquet.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
rust_xlsxwriter.workspace = true
zip.workspace = true

[lints]
workspace = true
