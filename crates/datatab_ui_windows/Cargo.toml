[package]
name = "datatab_ui_windows"
edition.workspace = true
version.workspace = true
authors.workspace = true
description = "Connection manager and settings windows for DataTab"
repository.workspace = true
homepage.workspace = true
license.workspace = true

[lib]

[dependencies]
gpui.workspace = true
gpui-component.workspace = true
datatab_ui_base.workspace = true
datatab_components.workspace = true
datatab_core.workspace = true
datatab_app.workspace = true
datatab_storage.workspace = true
datatab_portability.workspace = true
datatab_ssh.workspace = true
datatab_i18n.workspace = true
datatab_mcp = { workspace = true, optional = true }
datatab_policy = { workspace = true, optional = true }
uuid.workspace = true
log.workspace = true
serde_json.workspace = true
rfd.workspace = true
dirs.workspace = true
open = "5"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
datatab_components = { workspace = true, features = ["test-support"] }
datatab_ui_base = { workspace = true, features = ["test-support"] }

[features]
default = []
mcp = ["datatab_mcp", "datatab_policy", "datatab_app/mcp", "datatab_ui_base/mcp"]
# `lua` and `aws` are passthroughs: no windows code uses them directly, but they
# must forward to datatab_app/datatab_ui_base so datatab_app is not built twice with
# mismatched feature sets across the workspace.
lua = ["datatab_app/lua", "datatab_ui_base/lua"]
aws = ["datatab_app/aws", "datatab_ui_base/aws"]

[lints]
workspace = true
