[package]
name = "datatab_driver_redis"
version.workspace = true
edition.workspace = true
publish = false
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = { workspace = true }
datatab_core.workspace = true
datatab_ssh.workspace = true
log.workspace = true
redis = { version = "0.27", features = ["tls-rustls", "tls-rustls-insecure", "cluster", "sentinel"] }
serde_json.workspace = true
urlencoding = "2"
uuid.workspace = true

[dev-dependencies]
datatab_test_support.workspace = true
# The test binary enables both rustls providers, so a TLS test has to pick one,
# as `crates/datatab/src/main.rs` does. Declared here to reach `rustls::crypto`.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
tempfile = "3"
testcontainers = { version = "0.27", features = ["blocking"] }

[lints]
workspace = true
