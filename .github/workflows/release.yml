# Build and package the DataTab release artifacts.
#
# A push of a tag vX.Y.Z builds every package and creates a draft GitHub
# release for that tag. A manual run builds the ref you give it and only
# uploads workflow artifacts; it never creates a release.
#
# The release job only creates. If a release for the tag already exists, draft
# or published, it fails and changes nothing. To build a tag again, delete its
# draft release by hand first, then re-run the workflow.
#
# This workflow only builds. It runs no tests, lints or benchmarks.
#
# Runner facts, checked against the current GitHub documentation:
#   https://docs.github.com/en/actions/reference/runners/github-hosted-runners
#   https://github.com/actions/runner-images
# - ubuntu-24.04: 4 cores, 16 GB RAM, 14 GB SSD. Docker is installed; mold is
#   not. The image carries .NET, Android and GHC toolchains this build never
#   uses.
# - windows-2025: 4 cores, 16 GB RAM. Inno Setup 6 is installed.
# - macos-26: 3 cores (M1), 7 GB RAM, arm64. It ships Xcode 26, whose macOS
#   SDK builds for both arm64 and x86_64. Its Metal toolchain is preinstalled,
#   but it has been missing on some runs, so the macOS job checks it first.
# - The Intel macOS runner is much slower, so both macOS apps are built on
#   macos-26: the x86_64 app by cross-compiling. Apple: "You can build a
#   universal binary on either an Apple silicon or Intel-based Mac computer."
#   https://developer.apple.com/documentation/apple-silicon/building-a-universal-macos-binary
#
# Build jobs and memory:
# - Linux and Windows build with all 4 cores (JOBS=4) and keep the release
#   profile from Cargo.toml (thin LTO). Linux first frees disk space and adds a
#   12 GB swap file, so a memory peak spills to swap instead of killing the
#   runner.
# - macOS turns LTO off. With thin LTO the final crate is one rustc process
#   that needs about 9 GB, more than the 7 GB runner has. Without LTO the
#   peak is the parallel compile of the large crates, so JOBS is 3, one per
#   core. macOS adds swap on its own, but a build at the memory limit can
#   still be killed or swap until it times out. If that happens, use JOBS=2.
#
# No cargo cache. A release runs on a tag, and a cache saved on a tag can be
# read only by later runs on that same tag, not by the next release. A cache
# would need regular builds on the default branch to write it, and this
# repository has none. A release binary is therefore always built cold.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux (.deb)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      JOBS: "4"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mold cmake pkg-config libssl-dev libdbus-1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libpipewire-0.3-dev libgbm-dev libegl-dev \
            libxcb-randr0-dev libclang-dev libfontconfig1-dev libvulkan-dev \
            binutils gettext-base

      - name: Make room for the release build
        # Remove toolchains this job never uses, so the swap file and the build
        # fit on the 14 GB disk. Then replace the image's swap with 12 GB.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h /

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - name: Build the binary and the .deb
        run: sh scripts/build-linux.sh --deb

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-linux
          path: target/linux-package/datatab-linux-amd64.deb
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  windows:
    name: Windows (installer)
    runs-on: windows-2025
    timeout-minutes: 240
    env:
      JOBS: "4"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Make sure Inno Setup 6 is installed
        shell: pwsh
        run: |
          $onPath = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $default = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if ($onPath -or (Test-Path -LiteralPath $default)) {
              Write-Host 'Inno Setup 6 is installed'
              exit 0
          }
          choco install innosetup --version 6.7.1 --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install the pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version

      - name: Build the executable and the installer
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -File scripts/build-windows.ps1 -Jobs $env:JOBS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-windows
          path: target/windows-package/output/datatab-windows-amd64-setup.exe
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }} (.app)
    # Both apps build on the Apple Silicon runner; see the header.
    runs-on: macos-26
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-apple-darwin
          - arch: arm64
            target: aarch64-apple-darwin
    env:
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
      JOBS: "3"
      # macOS only: thin LTO does not fit in the runner's 7 GB. Linux and
      # Windows keep the release profile from Cargo.toml.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Check the runner architecture
        run: |
          machine=$(uname -m)
          if [ "$machine" != arm64 ]; then
            echo "expected an arm64 (Apple Silicon) runner, got $machine" >&2
            exit 1
          fi

      - name: Make sure the Metal toolchain is installed
        run: |
          xcodebuild -version
          if ! xcrun -sdk macosx metal --version; then
            echo "The Metal toolchain is missing; downloading it"
            xcodebuild -downloadComponent MetalToolchain
            xcrun -sdk macosx metal --version
          fi

      - name: Install the pinned Rust toolchain and the target
        # Run in the checkout, so the target is added to the toolchain that
        # rust-toolchain.toml pins. For arm64 it is already there.
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
          rustc --version

      - name: Build DataTab.app
        run: sh scripts/build-macos.sh "$TARGET"

      - name: Zip the app
        run: |
          binary_arch=$(lipo -archs target/macos-package/DataTab.app/Contents/MacOS/datatab)
          if [ "$binary_arch" != "$ARCH" ]; then
            echo "the app binary is built for '$binary_arch', expected '$ARCH'" >&2
            exit 1
          fi
          file target/macos-package/DataTab.app/Contents/MacOS/datatab
          mkdir -p dist
          ditto -c -k --keepParent target/macos-package/DataTab.app "dist/datatab-macos-$ARCH.zip"

      - name: Upload the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-macos-${{ matrix.arch }}
          path: dist/datatab-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  checksums:
    name: Collect and checksum
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - name: Write SHA256SUMS.txt
        working-directory: dist
        run: |
          expected="datatab-linux-amd64.deb datatab-macos-arm64.zip datatab-macos-x86_64.zip datatab-windows-amd64-setup.exe"
          for file in $expected; do
            [ -f "$file" ] || { echo "missing package: $file" >&2; exit 1; }
          done
          found=$(find . -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort | tr '\n' ' ')
          if [ "$found" != "$expected " ]; then
            echo "unexpected files in dist: $found" >&2
            exit 1
          fi
          # shellcheck disable=SC2086
          sha256sum $expected > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload the release set
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: datatab-release
          path: dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  release:
    name: Draft GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: checksums
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the release set
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: datatab-release
          path: dist

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "tag '$TAG' is not vX.Y.Z or vX.Y.Z-suffix" >&2
            exit 1
          fi
          # Create only: never upload into an existing release. Any answer
          # other than "release not found" stops the job.
          if view_output=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1); then
            echo "a release for $TAG already exists (draft: $view_output); this workflow changes nothing." >&2
            echo "To build $TAG again, delete its draft release by hand, then re-run." >&2
            exit 1
          fi
          case $view_output in
            *"release not found"*) ;;
            *)
              echo "could not check for an existing release for $TAG: $view_output" >&2
              exit 1
              ;;
          esac
          gh release create "$TAG" dist/* --draft --verify-tag \
            --title "DataTab $TAG" \
            --notes "Unsigned packages for DataTab $TAG. Check them against SHA256SUMS.txt."
